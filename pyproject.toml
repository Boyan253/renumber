[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "renumber"
version = "0.1.0"
description = "Batch-rename files to a numbered pattern with a dry run you can trust."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Boyan253/renumber"

[project.scripts]
renumber = "renumber:main"

[tool.setuptools]
py-modules = ["renumber"]
